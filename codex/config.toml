# プロジェクト配布用設定。<repo>/.codex/config.toml として配置する。
# trusted projectでのみ読み込まれ、CLI overrideより低くprofile/user configより優先される。
# sandbox内の単一通常commandは自動。境界外はGit保護付き入口で承認する。
default_permissions = "distributed"
approval_policy = "on-request"

[permissions.distributed]
extends = ":workspace"

[permissions.distributed.filesystem.":workspace_roots"]
".git" = "read"
".codex/hooks" = "read"
".codex/agents" = "read"
".codex/config.toml" = "read"
".codex/hooks.json" = "read"
".codex/rules" = "read"
".codex/tmp" = "read"
".agents/skills" = "read"
".mcp.json" = "read"
".claude/hooks" = "read"
".claude/skills" = "read"
".claude/agents" = "read"
".claude/settings.json" = "read"
".claude/settings.local.json" = "read"
".claude/tmp" = "read"

[permissions.distributed.network]
# localhost を含む通信はsandbox内で許可せず、外部実行の承認へ送る。
enabled = false
allow_local_binding = false

[features]
# 現行 Codex では既定で有効だが、配布設定が hooks.json を前提とすることを明示する。
hooks = true

[agents]
max_threads = 1
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"

# roleの登録を明示し、定義ファイルの自動検出には依存しない。内容は各ファイルを正本とする。
[agents.difficulty-evaluator]
config_file = "agents/difficulty-evaluator.toml"

[agents.code-reviewer]
config_file = "agents/code-reviewer.toml"

[agents.deep-reviewer]
config_file = "agents/deep-reviewer.toml"

[agents.design-reviewer]
config_file = "agents/design-reviewer.toml"

[agents.nesting-reviewer]
config_file = "agents/nesting-reviewer.toml"

[mcp_servers.chrome-devtools]
command = "bash"
# Chrome 149以上。localhostの全ポートだけを操作対象にする。
args = [".codex/hooks/shell/mcp-protected.sh", "npx", "-y", "chrome-devtools-mcp@1.9.0", "--workspace=.", "--experimentalScreencast=true", "--allowed-url-pattern=*://localhost:*/*", "--allowed-url-pattern=*://127.0.0.1:*/*", "--allowed-url-pattern=*://[\\:\\:1]:*/*"]
startup_timeout_sec = 20
default_tools_approval_mode = "approve"

[mcp_servers.chrome-devtools.tools.upload_file]
approval_mode = "prompt"

[mcp_servers.context-dictionary]
command = "bash"
args = [".codex/hooks/shell/mcp-protected.sh", "__CONTEXT_DICTIONARY_ROOT__/node_modules/.bin/tsx", "__CONTEXT_DICTIONARY_ROOT__/src/mcp/stdio.ts"]
env = { CONTEXT_AGENT = "codex" }
startup_timeout_sec = 20
default_tools_approval_mode = "prompt"

[mcp_servers.context-dictionary.tools.search]
approval_mode = "approve"

[mcp_servers.context-dictionary.tools.get]
approval_mode = "approve"
