# プロジェクト配布用設定。<repo>/.codex/config.toml として配置する。
# trusted project でのみ読み込まれ、CLI / profile / user config より優先度は低い。
# 可逆な workspace 内操作は自動化し、不可逆操作は rules の確認か hooks の拒否へ分離する。
default_permissions = "distributed"
approval_policy = "on-request"

[permissions.distributed]
# workspace 全体を write にし、任意階層の保護対象は PreToolUse hook で書き込みだけ拒否する。
# filesystem の read は任意階層 glob を受理しないため、配布設定には使用しない。
extends = ":workspace"

[permissions.distributed.network]
# AGENTS.md の HTTP Request 規約に合わせ、localhost を含む通信を sandbox 外承認へ送る。
enabled = false
allow_local_binding = false

[features]
# 現行 Codex では既定で有効だが、配布設定が hooks.json を前提とすることを明示する。
hooks = true

[agents]
max_threads = 1
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"

[mcp_servers.chrome-devtools]
command = "npx"
# Chrome 149以上。localhostの全ポートだけを操作対象にする。
args = ["-y", "chrome-devtools-mcp@1.6.0", "--allowed-url-pattern=*://localhost:*/*", "--allowed-url-pattern=*://127.0.0.1:*/*", "--allowed-url-pattern=*://[\\:\\:1]:*/*"]
startup_timeout_sec = 20
default_tools_approval_mode = "approve"

[mcp_servers.chrome-devtools.tools.upload_file]
approval_mode = "prompt"

[mcp_servers.serena]
command = "uvx"
args = [
  "--from", "git+https://github.com/oraios/serena@29d07d4f6b7a04a0db3981d6c6be6f736cfb44d2",
  "serena", "start-mcp-server",
  "--context", "codex",
  "--project-from-cwd",
]
startup_timeout_sec = 30
default_tools_approval_mode = "approve"
disabled_tools = [
  "execute_shell_command",
  "create_text_file",
  "replace_content",
  "replace_in_files",
  "delete_lines",
  "replace_lines",
  "insert_at_line",
  "replace_symbol_body",
  "insert_after_symbol",
  "insert_before_symbol",
  "rename_symbol",
]

[mcp_servers.context-dictionary]
command = "__CONTEXT_DICTIONARY_ROOT__/node_modules/.bin/tsx"
args = ["__CONTEXT_DICTIONARY_ROOT__/src/mcp/stdio.ts"]
env = { CONTEXT_AGENT = "codex" }
startup_timeout_sec = 20
default_tools_approval_mode = "prompt"

[mcp_servers.context-dictionary.tools.search]
approval_mode = "approve"

[mcp_servers.context-dictionary.tools.get]
approval_mode = "approve"
